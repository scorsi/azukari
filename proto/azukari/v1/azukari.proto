// Control messages of the azukari protocol (ADR 0003). Objects themselves travel as raw bodies.
// Content-Type: application/x-protobuf.
syntax = "proto3";

package azukari.v1;

option go_package = "github.com/scorsi/azukari/gen/azukari/v1;azukariv1";

// POST /v1/b/<bucket>/missing
message MissingRequest {
  // At most 10 000 keys.
  repeated string keys = 1;
}

message MissingResponse {
  // The requested keys that do not exist.
  repeated string keys = 1;
}

// POST /v1/b/<bucket>/list
message ListRequest {
  string prefix = 1;
  // Only keys strictly after this one.
  string start_after = 2;
  // At most 10 000.
  uint32 limit = 3;
}

message ListResponse {
  // In key order.
  repeated Object objects = 1;
  // Pass as start_after to continue; empty when the listing is complete.
  string next = 2;
}

message Object {
  string key = 1;
  uint64 size = 2;
  // SHA-256 of the object's bytes (32 bytes).
  bytes sha256 = 3;
}

// Body of every error response.
message Error {
  // Stable kebab-case reason, e.g. "key-invalid", "namespace-forbidden" (ADR 0003).
  string reason = 1;
}
