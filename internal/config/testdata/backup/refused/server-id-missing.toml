# want: tls.server_id: "" is not spiffe://
server = "https://store.example.org:8443"
bucket = "backup"
data_key_file = "/var/lib/azukari-backup/data.key"
paths = ["/var/lib/a", "/var/lib/b", "/var/lib/ab"]

[tls]
trust_domain = "example.org"
svid_file = "/run/azukari-backup/svid.pem"
key_file = "/run/azukari-backup/key.pem"
bundle_file = "/run/azukari-backup/bundle.pem"
